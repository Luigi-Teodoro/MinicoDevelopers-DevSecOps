name: CI/CD DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo de secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Análisis estático SAST (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config auto --error

      - name: Construir imagen Docker
        run: docker build -t minico-app:${{ github.sha }} .

      - name: Escaneo de imagen (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: minico-app:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Despliegue simulado con secreto
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: echo "Desplegando con credencial almacenada como secreto (valor oculto)"
